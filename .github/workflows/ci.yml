name: Backup CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: TogetherWeOwn/.github/.github/workflows/changes.yml@d427f7212f478ea3823a605edb394b0722e152b5 # v0.6.0
    with:
      areas-json: '{"backup":["backup/**"],"docs":["*.md","docs/**"],"worker":["worker/**"]}'
      docs-areas-json: '["docs"]'
      full-run-globs-json: '[".github/**","**/package.json","package.json","**/package-lock.json","package-lock.json","**/tsconfig*.json","tsconfig*.json"]'
  security:
    permissions:
      actions: read # Download OSV comparison artifacts for validation.
      contents: read
      security-events: write # Upload the pinned OSV scanner's SARIF evidence.
    uses: TogetherWeOwn/.github/.github/workflows/public-pr-security.yml@d427f7212f478ea3823a605edb394b0722e152b5 # v0.6.0
  unit:
    name: Unit and negative-path tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python unit and negative-path tests
        run: python3 -m unittest discover -s backup -v
  restore-fixtures:
    name: Offsite restore fixtures
    needs: changes
    if: needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).backup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAPERCLIP_RESTORE_IMAGE: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
      HINDSIGHT_RESTORE_IMAGE: pgvector/pgvector:pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pull reviewed immutable fixture images
        run: |
          docker pull "$PAPERCLIP_RESTORE_IMAGE"
          docker pull "$HINDSIGHT_RESTORE_IMAGE"
      - name: Both database restores and concurrent-write regression
        run: python3 backup/integration_restore.py
      - name: Cleanup all fixture containers even after cancellation
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=offsite-restore=true)
          if [ -n "$ids" ]; then docker rm -fv $ids; fi
          test -z "$(docker ps -aq --filter label=offsite-restore=true)"
          docker volume ls -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: isolated-restore-fixture-receipts
          path: artifacts/*.json
          retention-days: 14
          if-no-files-found: warn
  worker:
    name: Worker verification (no deploy)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.full_run == 'true' || fromJSON(needs.changes.outputs.areas).worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select preinstalled Node 24 without installing tools
        shell: bash
        run: |
          mapfile -t bins < <(find "$RUNNER_TOOL_CACHE/node" -path '*/24.*/x64/bin' -type d | sort -V)
          test "${#bins[@]}" -gt 0
          printf '%s\n' "${bins[-1]}" >> "$GITHUB_PATH"
      - name: Verify native install policy before clean install
        run: |
          node --version
          npm --version
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const [major, minor] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          assert.ok(major > 11 || (major === 11 && minor >= 19), 'npm with native release-age support required');
          const config = JSON.parse(execFileSync('npm', ['config', 'list', '--json'], { encoding: 'utf8' }));
          assert.equal(config['min-release-age'], 3);
          assert.equal(config['ignore-scripts'], true);
          JS
      - name: Clean frozen install with no lifecycle exceptions
        run: npm ci --no-audit --no-fund
      - name: Confirm manifest and lock graph were not changed
        run: git diff --exit-code -- package.json package-lock.json
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Non-deploy Worker build
        run: npm run build
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, security, unit, restore-fixtures, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful checks or intentionally skipped fixtures
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 -I - <<'PY'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert all(j['result'] in ('success', 'skipped') for j in jobs.values()), jobs
          assert jobs['changes']['result'] == jobs['unit']['result'] == 'success', jobs
          outputs = jobs['changes']['outputs']
          areas = json.loads(outputs['areas'])
          if os.environ['EVENT_NAME'] != 'pull_request' or outputs['full_run'] == 'true' or areas.get('worker', False):
              assert jobs['worker']['result'] == 'success', jobs
          PY
