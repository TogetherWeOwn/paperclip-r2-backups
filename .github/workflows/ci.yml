name: Backup CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: TogetherWeOwn/.github/.github/workflows/changes.yml@20d95fd8c249c7192c364f8b41519fca3fc873df
    with:
      areas-json: '{"backup":["backup/**"],"docs":["*.md","docs/**"],"worker":["worker/**"]}'
      docs-areas-json: '["docs"]'
      full-run-globs-json: '[".github/**","**/package.json","package.json","**/package-lock.json","package-lock.json","**/tsconfig*.json","tsconfig*.json"]'
  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: TogetherWeOwn/.github/.github/workflows/public-pr-security.yml@20d95fd8c249c7192c364f8b41519fca3fc873df
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python unit and negative-path tests
        run: python3 -m unittest discover -s backup -v
  restore-fixtures:
    needs: changes
    if: needs.changes.outputs.full_run == 'true' || (fromJSON(needs.changes.outputs.areas).backup && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAPERCLIP_RESTORE_IMAGE: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
      HINDSIGHT_RESTORE_IMAGE: pgvector/pgvector:pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pull reviewed immutable fixture images
        run: |
          docker pull "$PAPERCLIP_RESTORE_IMAGE"
          docker pull "$HINDSIGHT_RESTORE_IMAGE"
      - name: Both database restores and concurrent-write regression
        run: python3 backup/integration_restore.py
      - name: Cleanup all fixture containers even after cancellation
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=offsite-restore=true)
          if [ -n "$ids" ]; then docker rm -fv $ids; fi
          test -z "$(docker ps -aq --filter label=offsite-restore=true)"
          docker volume ls -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: isolated-restore-fixture-receipts
          path: artifacts/*.json
          retention-days: 14
          if-no-files-found: warn
  ci-ok:
    if: always()
    needs: [changes, security, unit, restore-fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful checks or intentionally skipped fixtures
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert all(j['result'] in ('success', 'skipped') for j in jobs.values()), jobs
          assert jobs['changes']['result'] == jobs['unit']['result'] == 'success', jobs
          PY
